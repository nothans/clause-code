[project]
name = "clause-code"
dynamic = ["version"]
description = "A holiday-themed coding agent for your terminal, built on the Claude Agent SDK, that can follow the live CheerLights color"
authors = [{name = "Hans Scharler"}]
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
keywords = [
    "ai",
    "coding",
    "assistant",
    "agent",
    "claude",
    "claude-agent-sdk",
    "anthropic",
    "terminal",
    "cli",
    "christmas",
    "cheerlights",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development",
]

dependencies = [
    "claude-agent-sdk==0.2.188",
    "rich==15.0.0",
    "prompt-toolkit==3.0.53",
    "pydantic==2.14.1",
    "paho-mqtt==2.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.1",
    "ruff==0.17.2",
]

[project.scripts]
clause-code = "clause_code.cli:main"

[project.urls]
Homepage = "https://github.com/nothans/clause-code"
Repository = "https://github.com/nothans/clause-code"
Documentation = "https://github.com/nothans/clause-code/tree/main/docs"
Issues = "https://github.com/nothans/clause-code/issues"
Changelog = "https://github.com/nothans/clause-code/blob/main/docs/whats-new-3.0.md"
"Blog post" = "https://nothans.com/introducing-clause-code"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/clause_code/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/clause_code"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
