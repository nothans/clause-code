[project]
name = "clause-code"
dynamic = ["version"]
description = "The AI coding assistant that brings holiday cheer to your terminal"
authors = [{name = "Hans Scharler"}]
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
keywords = ["ai", "coding", "assistant", "christmas", "claude", "anthropic", "agent"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "claude-agent-sdk>=0.2.174,<0.3",
    "rich>=13.7.0",
    "prompt-toolkit>=3.0.43",
    "pydantic>=2.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.6.0",
]

[project.scripts]
clause-code = "clause_code.cli:main"

[project.urls]
Homepage = "https://github.com/nothans/clause-code"
Repository = "https://github.com/nothans/clause-code"
Documentation = "https://github.com/nothans/clause-code#readme"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/clause_code/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/clause_code"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
